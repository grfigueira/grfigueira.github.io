<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/icons/favicon.ico" type="image/x-icon">
  <title>Guilherme Figueira — Portfolio</title>

  <!-- Tailwind CDN + your exact config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgLight: '#f4f8f3',
            panelLight: '#ededec',
            lineLight: '#e3e3e2',
            inkLight: '#121212',
            mutedLight: '#6b6b6b',
            bgDark: '#0b1215',
            panelDark: '#0f171f',
            lineDark: '#161616',
            inkDark: '#e7eef5',
            mutedDark: '#9aa5ae',
          },
          boxShadow: { card: '0 10px 24px rgba(0,0,0,0.10)' },
          borderRadius: { xl2: '1.25rem' },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-bgLight text-inkLight dark:bg-bgDark dark:text-inkDark transition-colors duration-150">

  

  <main class="mx-auto max-w-6xl px-6">
    


<header
  class="sticky top-0 z-10 backdrop-blur bg-bgLight/90 dark:bg-bgDark/90 border-b border-lineLight dark:border-lineDark transition-colors duration-150">
  <div class="mx-auto max-w-6xl px-6 py-3 flex items-center justify-between gap-4">
    <a href="/#projects" class="font-medium cursor-pointer">Guilherme Figueira</a>
    <button id="themeToggle" aria-label="Activate dark mode" aria-pressed="false"
      class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-lineLight dark:border-lineDark bg-white/60 dark:bg-panelDark shadow-sm">
      <img src="/assets/sun.svg" class="block dark:hidden w-5 h-5" alt="">
      <img src="/assets/moon.svg" class="hidden dark:block w-5 h-5" alt="">
    </button>
  </div>
</header>




<nav class="py-6 text-sm text-mutedLight dark:text-mutedDark">
  <a href="/#projects"
    class="inline-flex items-center gap-2 rounded-full border border-lineLight dark:border-lineDark bg-white/70 dark:bg-panelDark px-4 py-1.5 transition-colors hover:text-inkLight dark:hover:text-inkDark">
    <span aria-hidden="true">←</span>
    Back to projects
  </a>
</nav>


<section class="pb-12">
  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-8 max-w-5xl">
    <div class="space-y-3 md:flex-1">
      <h1 class="text-4xl font-semibold leading-tight">The Shape Of Silence</h1>
      

      
      <div class="flex flex-wrap gap-3 text-sm pt-2">
        
        <span
          class="inline-flex items-center rounded-full bg-panelLight dark:bg-panelDark border border-lineLight dark:border-lineDark px-3 py-1">Team size: 1</span>
        
        <span
          class="inline-flex items-center rounded-full bg-panelLight dark:bg-panelDark border border-lineLight dark:border-lineDark px-3 py-1">Time Frame: Ongoing</span>
        
        <span
          class="inline-flex items-center rounded-full bg-panelLight dark:bg-panelDark border border-lineLight dark:border-lineDark px-3 py-1">Tools: Unreal Engine 5, C++, FMOD</span>
        
      </div>
      

      
    </div>

    
    
    

    <div
      class="md:flex-shrink-0 w-full md:w-auto aspect-video overflow-hidden rounded-xl2 border border-lineLight dark:border-lineDark shadow-card"
      style="--header-w: 420px;">
      <div class="h-full w-full md:[width:var(--header-w)]">
        <img src="/assets/gifs/EasyDialogueEditor.gif" alt="Usage overview" class="w-full h-full object-cover"
          loading="lazy">
      </div>
    </div>
    

  </div>
</section>







<section class="pb-12 space-y-6 max-w-3xl">
  <h2 class="text-xl font-medium">Video Showcase</h2>
  <p class="text-mutedLight dark:text-mutedDark">I uploaded a short video announcing the release of the project on Youtube. It showcases some the program&#39;s features.</p>
  <div
    class="relative overflow-hidden rounded-xl2 border border-lineLight dark:border-lineDark shadow-card bg-black aspect-video">
    <iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/M8uM_cWPmNM?rel=0"
      title="Video" loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>
  </div>
</section>






  </main>

  

  <footer class="border-t border-lineLight dark:border-lineDark text-center text-xs text-mutedLight dark:text-mutedDark py-4">
    Portfolio Last Updated: 2025/10
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
